# NiftyShield log rotation config
# Run manually or via weekly cron:
#   logrotate -s /path/to/NiftyShield/logs/.logrotate.state /path/to/NiftyShield/config/logrotate.conf
#
# Add to crontab (runs every Sunday at 2am):
#   0 2 * * 0  logrotate -s /Users/abhadra/myWork/myCode/python/NiftyShield/logs/.logrotate.state /Users/abhadra/myWork/myCode/python/NiftyShield/config/logrotate.conf

/Users/abhadra/myWork/myCode/python/NiftyShield/logs/intraday.log
/Users/abhadra/myWork/myCode/python/NiftyShield/logs/apiconnect.log
/Users/abhadra/myWork/myCode/python/NiftyShield/logs/snapshot.log
/Users/abhadra/myWork/myCode/python/NiftyShield/logs/paper_snapshot.log
/Users/abhadra/myWork/myCode/python/NiftyShield/logs/morning_nav.log
{
    # weekly rotation, keep 8 weeks (~2 months of history)
    weekly
    rotate 8
    compress
    # compress the previous rotation, not the just-rotated one
    delaycompress
    # don't error if log doesn't exist yet
    missingok
    # don't rotate empty files
    notifempty
    # copy then truncate — safe for cron jobs using >> append redirect
    copytruncate
}
