[project]
name = "niftyshield"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "pytest-randomly>=3.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "detect-secrets>=1.4",
    "commitizen>=3.0",
    "vulture>=2.0",
    "bandit>=1.7",
    "pylint>=3.0",
    "pydantic-settings>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
addopts = "-n auto"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "sandbox: marks tests requiring Upstox sandbox token",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["docs/", "data/", ".git/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # do not perform function calls in default args (Pydantic validators)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
# Permissive baseline — incremental adoption
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = false

# Strict on src/client
[[tool.mypy.overrides]]
module = ["src.client.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

# Strict on src/paper
[[tool.mypy.overrides]]
module = ["src.paper.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

[tool.coverage.run]
source = ["src"]
omit = ["src/analytics/*", "src/sandbox/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
fail_under = 80


