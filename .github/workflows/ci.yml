name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]" --break-system-packages

      - name: Run linting and type checking
        run: make lint

      - name: Run security check
        run: make security

      - name: Run tests with coverage
        run: |
          python -m pytest tests/unit/ --cov=src --cov-report=xml \
              --cov-report=html --cov-report=term-missing -n auto -q
        env:
          UPSTOX_ENV: test

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          thresholds: "80 80"
          output: both
          format: markdown
          hide_complexity: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.10'
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  docs-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]" --break-system-packages

      - name: Line length (repo-wide)
        run: |
          git ls-files ':(glob)**/*.md' | grep -vE '^docs/archive/|/_TEMPLATE/|^docs/council/' \
              | xargs python scripts/dev/hooks/check_md_line_length.py

      - name: Story structure (repo-wide, strict)
        run: python scripts/dev/hooks/check_story_structure.py --all --strict

      - name: Checkbox consistency (repo-wide)
        run: python scripts/dev/hooks/check_checkbox_consistency.py --all
