repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies: [pydantic>=2.0, pydantic-settings, types-requests, types-PyYAML]
        files: ^src/(client|paper)/

  - repo: local
    hooks:
      - id: no-script-main-logger
        name: "scripts must not use get_logger(__name__)"
        language: pygrep
        entry: "get_logger\\(__name__\\)"
        files: ^scripts/
        types: [python]

      - id: no-bare-logging
        name: "src/ and scripts/ must not use bare logging.getLogger"
        language: pygrep
        entry: "logging\\.getLogger"
        exclude: "^src/utils/logging\\.py$"
        files: ^(src|scripts)/
        types: [python]

      - id: md-line-length
        name: "markdown lines must be <=200 chars (root + docs/plan + docs/bugs)"
        language: system
        entry: python scripts/hooks/check_md_line_length.py
        files: '^([^/]+\.md|docs/(plan|bugs)/.*\.md)$'
        pass_filenames: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: (tests/fixtures|\.env\.example)
